[project]
name = "payment-service-django"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "woozlic", email = "sampaccs@mail.ru" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "django>=6.1.1",
    "djangorestframework>=3.18.0",
    "djangorestframework-simplejwt>=5.5.1",
    "environs[django]>=15.2.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "redis>=8.1.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-stubs>=6.1.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.16.6",
]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
