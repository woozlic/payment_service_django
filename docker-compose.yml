services:
  db:
    image: postgres:alpine
    env_file: .env
    ports: ["${POSTGRES_PORT}:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready - U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10
  redis:
    image: redis:alpine
    ports: ["${REDIS_PORT}:6379"]
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]

volumes:
  pgdata:
  redisdata: